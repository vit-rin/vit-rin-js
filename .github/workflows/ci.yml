name: CI

# Typecheck and unit tests on every push and pull request. The bundle size
# budget and the no-React check live in size.yml, which runs the build.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every action is a commit and every third-party image a digest (M5 task C.4).
      - name: Pins
        run: npm run check:pins

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # S1 against the real API (M1): refresh with a single retry, idempotent
  # replay, and a typed 429, against vit-rin-backend with real Postgres and
  # Redis. The API's development log sender stands in for SMS, and the test
  # reads the one-time code from its log.
  #
  # Needs read access to vit-rin-backend: set the BACKEND_READ_TOKEN secret.
  # E2E_BACKEND_REF (a repository variable) names the revision; default main.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: vitrin
          POSTGRES_PASSWORD: vitrin
          POSTGRES_DB: vitrin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitrin -d vitrin"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: vit-rin/vit-rin-backend
          ref: ${{ vars.E2E_BACKEND_REF || 'main' }}
          token: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
          path: backend

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the backend, migrate, and start the API
        working-directory: backend
        env:
          DATABASE_URL: postgres://vitrin:vitrin@localhost:5432/vitrin?sslmode=disable
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/" ./cmd/api ./cmd/migrate
          "$RUNNER_TEMP/bin/migrate" up
          # Development environment: OTP codes go to the log, the signing key
          # is generated per start. Everything in this run is one address, so
          # the per-address limits are raised; the per-phone limit is 7 (the 429 test
          # sends 8, and the operator signs in five times for S1 and once more for the
          # cross-site check) .
          ENVIRONMENT=development LOG_FORMAT=text HTTP_ADDR=127.0.0.1:8190 \
            REDIS_ADDR=localhost:6379 REDIS_DB=1 \
            AUTH_BOOTSTRAP_SUPER_ADMIN_PHONE=+989120000001 \
            RATE_LIMIT_OTP_START_IP=1000/1m RATE_LIMIT_OTP_VERIFY_IP=1000/1m \
            RATE_LIMIT_TOKEN_IP=1000/1m RATE_LIMIT_TOKEN_CLIENT=1000/1m \
            HTTP_ORIGIN_REFRESH=1s RATE_LIMIT_OTP_START_PHONE=7/15m \
            nohup "$RUNNER_TEMP/bin/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8190/readyz >/dev/null && exit 0
            sleep 1
          done
          echo "the API did not become ready" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: S1 against the real API
        run: npm run test:integration
        env:
          VITRIN_API_URL: http://127.0.0.1:8190
          VITRIN_API_LOG: ${{ runner.temp }}/api.log
          VITRIN_ADMIN_PHONE: "+989120000001"

      # The types are the API's: regenerate them from the specifications this API serves and fail on any
      # difference (docs/SDK-CONTRACT.md; backend M5 task C.3).
      - name: Generated types are what the API serves
        run: npm run types:check
        env:
          VITRIN_API_URL: http://127.0.0.1:8190

      # The cross-site check: a page on another site loads the CDN build and signs in, reads, refreshes and
      # signs out against this API, and no request reaches it with a credential (e2e/cross-site). It needs a
      # backend that answers CORS for logout (backend M5 task C.3): set E2E_BACKEND_REF to a revision that has it
      # until that is on main.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build the CDN bundle
        run: npm run build

      - name: Cross-site check
        run: npm run test:cross-site
        env:
          VITRIN_API_URL: http://127.0.0.1:8190
          VITRIN_API_LOG: ${{ runner.temp }}/api.log
          VITRIN_ADMIN_PHONE: "+989120000001"
