name: Release

# A tag `vX.Y.Z` builds the SDK once and publishes its browser build as the
# release artifact `vit-rin-js-vX.Y.Z.tar.gz`, with its checksum. Deploy installs
# that file, unchanged, at `<cdn>/sdk/X.Y.Z/` (vit-rin-deploy: scripts/install-release.sh)
# and a Game loads `<cdn>/sdk/X.Y.Z/vit-rin.min.js`, pinned. A version is immutable:
# never re-tag, cut the next one. npm publishing is deferred (ROADMAP D-25).
#
# The artifact is the contents of build/iife for the CDN: vit-rin.min.js, its map and its Subresource Integrity
# value (vit-rin.min.js.integrity), which a Game pins with <script integrity="…" crossorigin="anonymous">.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A release is built by a job that can publish, so a known high or critical advisory in what it runs
      # stops it (M5 task C.4).
      - run: npm run audit:deps
      - name: The tag is the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      # The Subresource Integrity value of the file a Game loads. It is written beside the file, so the artifact
      # carries it and the CDN serves it at <cdn>/sdk/X.Y.Z/vit-rin.min.js.integrity; it is published with the
      # release and in its notes; and it is checked here against openssl, which does not share its code.
      - name: Subresource Integrity
        run: |
          node scripts/integrity.mjs build/iife/vit-rin.min.js
          want="sha384-$(openssl dgst -sha384 -binary build/iife/vit-rin.min.js | openssl base64 -A)"
          test "$(cat build/iife/vit-rin.min.js.integrity)" = "$want"
      - name: Package the browser build
        run: |
          tar -czf "vit-rin-js-${GITHUB_REF_NAME}.tar.gz" -C build/iife vit-rin.min.js vit-rin.min.js.map vit-rin.min.js.integrity
          sha256sum "vit-rin-js-${GITHUB_REF_NAME}.tar.gz" | cut -d' ' -f1 > "vit-rin-js-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "vit-rin-js-${GITHUB_REF_NAME}.tar.gz" \
            "vit-rin-js-${GITHUB_REF_NAME}.tar.gz.sha256" \
            build/iife/vit-rin.min.js.integrity \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            --notes "Subresource Integrity of vit-rin.min.js: \`$(cat build/iife/vit-rin.min.js.integrity)\`"
