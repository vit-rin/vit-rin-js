name: Release

# A tag `vX.Y.Z` builds the SDK once and publishes its browser build as the
# release artifact `vit-rin-js-vX.Y.Z.tar.gz`, with its checksum. Deploy installs
# that file, unchanged, at `<cdn>/sdk/X.Y.Z/` (vit-rin-deploy: scripts/install-release.sh)
# and a Game loads `<cdn>/sdk/X.Y.Z/vit-rin.min.js`, pinned. A version is immutable:
# never re-tag, cut the next one. npm publishing is deferred (ROADMAP D-25).
#
# The artifact is the contents of build/iife for the CDN: vit-rin.min.js and its map.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The tag is the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Package the browser build
        run: |
          tar -czf "vit-rin-js-${GITHUB_REF_NAME}.tar.gz" -C build/iife vit-rin.min.js vit-rin.min.js.map
          sha256sum "vit-rin-js-${GITHUB_REF_NAME}.tar.gz" | cut -d' ' -f1 > "vit-rin-js-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "vit-rin-js-${GITHUB_REF_NAME}.tar.gz" \
            "vit-rin-js-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --title "${GITHUB_REF_NAME}" --generate-notes
